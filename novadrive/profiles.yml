dbt_novadrive:
  target: dev
  outputs:
    dev:
      type: databricks
      catalog: workspace
      schema: "{{env_var('DATABRICKS_ENV')}}"
      host: "{{env_var('DATABRICKS_HOST')}}"
      http_path: "{{env_var('DATABRICKS_HTTP_PATH')}}"
      token: "{{env_var('DATABRICKS_TOKEN')}}"
      threads: 4
      