name: CI/CD Pipeline

on:
  push:
    branches:
      - main

    workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest
    environment: venv

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: dbt debug
        run: dbt debug

      - name: dbt deps
        run: dbt deps

      - name: dbt parse
        run: dbt parse

      - name: dbt build
        run: dbt build      